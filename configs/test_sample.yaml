# 4DGS Pipeline Configuration for Test/Sample Data
# ================================================
# This config is pre-tuned for small public datasets and quick testing.
# Use with: python main.py --config configs/test_sample.yaml

# === Paths ===
input_dir: data/inputs/sample_synthetic
processed_dir: data/processed
output_dir: data/outputs

# === Experiment ===
experiment_name: test_sample
skip_existing: true
verbose: true

# === Frame Extraction ===
# For pre-extracted datasets, these settings are used if re-processing is needed
frame_extraction:
  fps: 30.0
  quality: 95
  format: png
  start_time: 0.0
  duration: null
  resize_width: 400        # Lower resolution for faster testing
  resize_height: 400

# === COLMAP Settings ===
# For datasets with existing poses, COLMAP can be skipped using --skip_colmap
colmap:
  camera_model: OPENCV
  single_camera: false
  single_camera_per_folder: true
  matcher_type: sequential    # Sequential is faster for video sequences
  use_gpu: true
  gpu_index: 0
  max_image_size: 1600        # Limit image size for faster processing
  num_threads: -1

# === Training Settings ===
# Reduced iterations for quick testing
training:
  iterations: 10000           # Reduced for testing (use 30000 for production)
  save_iterations:
    - 5000
    - 10000
  test_iterations:
    - 5000
    - 10000
  resolution: 1               # 1 = 1/1 scale, 2 = 1/2 scale, etc.
  white_background: false

# === Rendering Settings ===
render:
  output_format: mp4
  fps: 30
  codec: libx264
  crf: 23                     # Slightly higher compression for test outputs
  camera_path_type: interpolate
  num_frames: 100             # Fewer frames for quick testing
  width: null
  height: null
