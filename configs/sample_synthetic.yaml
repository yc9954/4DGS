# 4DGS Pipeline Configuration for sample_synthetic
# Auto-generated by download_sample_data.sh
# Dataset type: synthetic

# === Paths ===
input_dir: data/inputs/sample_synthetic
processed_dir: data/processed
output_dir: data/outputs

# === Experiment ===
experiment_name: sample_synthetic
skip_existing: true
verbose: true

# === Frame Extraction ===
# Skip frame extraction for pre-extracted datasets
frame_extraction:
  fps: 30.0
  quality: 95
  format: png
  start_time: 0.0
  duration: null
  resize_width: null
  resize_height: null

# === COLMAP Settings ===
# Most downloaded datasets come with poses, so COLMAP may be skipped
colmap:
  camera_model: OPENCV
  single_camera: false
  single_camera_per_folder: true
  matcher_type: sequential
  use_gpu: true
  gpu_index: 0
  max_image_size: 1600
  num_threads: -1

# === Training Settings ===
training:
  iterations: 30000
  save_iterations:
    - 7000
    - 15000
    - 30000
  test_iterations:
    - 7000
    - 15000
    - 30000
  resolution: -1
  white_background: false

# === Rendering Settings ===
render:
  output_format: mp4
  fps: 30
  codec: libx264
  crf: 18
  camera_path_type: interpolate
  num_frames: 300
  width: null
  height: null
